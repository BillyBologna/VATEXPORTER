<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor VAT Pro - Billy Bologna</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; }
        canvas { display: block; }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            pointer-events: none; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="info">Cargando escena VAT...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const CONFIG = {
            modelPath: 'my_mesh_data.obj',             
            texturePath: 'my_mesh_data_positions.png', 
            totalFrames: 299,                        
            totalVertices: 382,                      
            minPos: new THREE.Vector3(-4.2086, -1.0, -4.2086), 
            maxPos: new THREE.Vector3(4.2086, 20.3173, 4.2086)    
        };

        let scene, camera, renderer, model, vatMaterial;

        init();

        function init() {
            // --- ESCENA ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.Fog(0x1a1a1a, 20, 100); // Niebla para dar profundidad

            // --- CÁMARA ---
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 25);

            // --- RENDERER ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true; // Habilitar sombras
            document.body.appendChild(renderer.domElement);

            new OrbitControls(camera, renderer.domElement);

            // --- ILUMINACIÓN ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const fillLight = new THREE.PointLight(0x44aaff, 1);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            // --- SUELO Y REFERENCIA ---
            // Plano de suelo
            const planeGeo = new THREE.PlaneGeometry(100, 100);
            const planeMat = new THREE.MeshStandardMaterial({ 
                color: 0x222222, 
                roughness: 0.8, 
                metalness: 0.2 
            });
            const floor = new THREE.Mesh(planeGeo, planeMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Rejilla (Grid)
            const grid = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
            scene.add(grid);

            // --- VAT MATERIAL ---
            const loader = new THREE.TextureLoader();
            const vatTexture = loader.load(CONFIG.texturePath);
            vatTexture.minFilter = THREE.NearestFilter;
            vatTexture.magFilter = THREE.NearestFilter;

            vatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: vatTexture },
                    uMinPos: { value: CONFIG.minPos },
                    uMaxPos: { value: CONFIG.maxPos },
                    uTotalFrames: { value: CONFIG.totalFrames },
                    uTotalVertices: { value: CONFIG.totalVertices }
                },
                vertexShader: `
                    varying vec3 vPosition;
                    uniform sampler2D uTexture;
                    uniform float uTime;
                    uniform float uTotalFrames;
                    uniform float uTotalVertices;
                    uniform vec3 uMinPos;
                    uniform vec3 uMaxPos;

                    void main() {
                        float vId = float(gl_VertexID);
                        float x = uTime / uTotalFrames; 
                        float y = vId / uTotalVertices;
                        
                        vec3 color = texture2D(uTexture, vec2(x, y)).rgb;
                        vec3 newPosition = uMinPos + color * (uMaxPos - uMinPos);
                        
                        vPosition = newPosition;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vPosition;
                    void main() {
                        // Creamos un color basado en la altura (Y) para que no sea plano
                        // Esto simula profundidad ya que no tenemos normales reales
                        float height = (vPosition.y + 1.0) / 21.0; 
                        vec3 colorA = vec3(0.2, 0.4, 0.8); // Azul oscuro
                        vec3 colorB = vec3(0.5, 0.8, 1.0); // Azul claro
                        vec3 finalColor = mix(colorA, colorB, height);
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `,
                wireframe: false // <--- IMPORTANTE: Desactivado para ver caras
            });

            // --- CARGA DE MODELO ---
            const objLoader = new OBJLoader();
            objLoader.load(CONFIG.modelPath, (obj) => {
                model = obj;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material = vatMaterial;
                        child.castShadow = true;
                    }
                });
                scene.add(model);
                document.getElementById('info').innerHTML = "Visor VAT Activo <br> Modelo: Sólido | Suelo: Referencial";
            }, undefined, (err) => {
                document.getElementById('info').innerHTML = "Error cargando el archivo OBJ";
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (vatMaterial) {
                // Animación en loop
                const time = (Date.now() * 0.03) % CONFIG.totalFrames; 
                vatMaterial.uniforms.uTime.value = time;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
