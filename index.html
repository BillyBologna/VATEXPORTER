<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor VAT Pro - Billy Bologna</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            pointer-events: none; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #00d4ff;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>VAT System Activo</strong><br>
        Estado: Cargando mallas y texturas...
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // CONFIGURACIÓN (Asegúrate que coincida con tu exportación de Maya)
        // =========================================================================
        const CONFIG = {
            modelPath: 'my_mesh_data.obj',             
            texturePath: 'my_mesh_data_positions.png', 
            normTexturePath: 'my_mesh_data_normals.png', // <--- NUEVA TEXTURA
            totalFrames: 299,                        
            totalVertices: 382,                      
            minPos: new THREE.Vector3(-4.2086, -1.0, -4.2086), 
            maxPos: new THREE.Vector3(4.2086, 20.3173, 4.2086)    
        };
        // =========================================================================

        let scene, camera, renderer, model, vatMaterial;

        init();

        function init() {
            // --- ESCENA Y FOG ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 20, 100);

            // --- CÁMARA ---
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 25);

            // --- RENDERER ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            new OrbitControls(camera, renderer.domElement);

            // --- ILUMINACIÓN ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const fillLight = new THREE.PointLight(0x00d4ff, 1);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            // --- SUELO DE REFERENCIA ---
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x151515, 
                roughness: 0.8, 
                metalness: 0.2 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(100, 50, 0x333333, 0x222222);
            scene.add(grid);

            // --- CARGA DE TEXTURAS VAT ---
            const loader = new THREE.TextureLoader();
            const posTexture = loader.load(CONFIG.texturePath);
            const normTexture = loader.load(CONFIG.normTexturePath); // Cargar normales

            // Configuración crítica para evitar que Three.js suavice los datos (están en píxeles exactos)
            [posTexture, normTexture].forEach(tex => {
                tex.minFilter = THREE.NearestFilter;
                tex.magFilter = THREE.NearestFilter;
                tex.wrapS = THREE.RepeatWrapping; 
                tex.wrapT = THREE.ClampToEdgeWrapping;
            });

            // --- MATERIAL VAT CON SOMBREADO ---
            vatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: posTexture },
                    uNormTexture: { value: normTexture },
                    uMinPos: { value: CONFIG.minPos },
                    uMaxPos: { value: CONFIG.maxPos },
                    uTotalFrames: { value: CONFIG.totalFrames },
                    uTotalVertices: { value: CONFIG.totalVertices },
                    uLightPos: { value: new THREE.Vector3(10, 20, 10) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vWorldPosition;
                    uniform sampler2D uTexture;
                    uniform sampler2D uNormTexture;
                    uniform float uTime;
                    uniform float uTotalFrames;
                    uniform float uTotalVertices;
                    uniform vec3 uMinPos;
                    uniform vec3 uMaxPos;

                    void main() {
                        float vId = float(gl_VertexID);
                        float x = uTime / uTotalFrames; 
                        float y = vId / uTotalVertices;

                        // 1. Calcular Posición
                        vec3 posColor = texture2D(uTexture, vec2(x, y)).rgb;
                        vec3 newPosition = uMinPos + posColor * (uMaxPos - uMinPos);
                        
                        // 2. Calcular Normal (Remapear de [0,1] a [-1,1])
                        vec3 normColor = texture2D(uNormTexture, vec2(x, y)).rgb;
                        vNormal = normColor * 2.0 - 1.0;
                        
                        vWorldPosition = newPosition;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    varying vec3 vWorldPosition;
                    uniform vec3 uLightPos;

                    void main() {
                        // Normalizar la normal interpolada
                        vec3 n = normalize(vNormal);
                        
                        // Vector dirección hacia la luz
                        vec3 lightDir = normalize(uLightPos - vWorldPosition);
                        
                        // Cálculo de Iluminación Difusa (Lambert)
                        float diff = max(dot(n, lightDir), 0.0);
                        
                        // Color base basado en la altura para dar estilo
                        float height = (vWorldPosition.y + 1.0) / 21.0;
                        vec3 colorBase = mix(vec3(0.1, 0.3, 0.6), vec3(0.0, 0.8, 1.0), height);
                        
                        // Combinar color, luz difusa y un toque de luz ambiental
                        vec3 finalColor = colorBase * (diff + 0.3);
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `,
                wireframe: false // <--- CARAS SÓLIDAS
            });

            // --- CARGA DE MODELO OBJ ---
            const objLoader = new OBJLoader();
            objLoader.load(CONFIG.modelPath, (obj) => {
                model = obj;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material = vatMaterial;
                        child.castShadow = true;
                    }
                });
                scene.add(model);
                document.getElementById('info').innerHTML = "<strong>Visor VAT Pro Activo</strong><br>Sombreado: Normales Realistas<br>Modo: Sólido";
            }, undefined, (err) => {
                document.getElementById('info').innerHTML = "Error cargando el archivo OBJ";
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (vatMaterial) {
                // Animación en loop suave
                const time = (Date.now() * 0.03) % CONFIG.totalFrames; 
                vatMaterial.uniforms.uTime.value = time;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
