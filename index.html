<!DOCTYPE html>
<html lang="es">
<head>
    <title>Mi Visor VAT - Vertex Animation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">Cargando Visor VAT...<br>Sube tu modelo y textura a la carpeta.</div>

    <!-- Importamos Three.js desde un CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build,three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // CONFIGURACIÓN (CAMBIA ESTOS VALORES CON LOS DE TU MAYA)
        // =========================================================================
        const CONFIG = {
            modelPath: 'modelo.glb',        // Nombre de tu archivo GLB
            texturePath: 'vertex_position_data.png', 
            totalFrames: 120,               // Ancho de tu imagen
            totalVertices: 382,            // Alto de tu imagen
            minPos: new THREE.Vector3(-5.608, -2.0, -1.0), // COPIAR DE MAYA (Min)
            maxPos: new THREE.Vector3(5.608, 10.0, 2.0)    // COPIAR DE MAYA (Max)
        };
        // =========================================================================

        let scene, camera, renderer, model, vatMaterial;

        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            new OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1));
            scene.add(new THREE.DirectionalLight(0xffffff, 2));

            // Cargamos la textura VAT
            const loader = new THREE.TextureLoader();
            const vatTexture = loader.load(CONFIG.texturePath);
            vatTexture.minFilter = THREE.NearestFilter; // Crucial: Sin interpolación
            vatTexture.magFilter = THREE.NearestFilter;
            vatTexture.wrapS = THREE.RepeatWrapping; // Para que la animación haga loop

            // Creamos el ShaderMaterial
            vatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: vatTexture },
                    uMinPos: { value: CONFIG.minPos },
                    uMaxPos: { value: CONFIG.maxPos },
                    uTotalFrames: { value: CONFIG.totalFrames },
                    uTotalVertices: { value: CONFIG.totalVertices }
                },
                vertexShader: `
                    varying vec2 vUv;
                    uniform sampler2D uTexture;
                    uniform float uTime;
                    uniform float uTotalFrames;
                    uniform float uTotalVertices;
                    uniform vec3 uMinPos;
                    uniform vec3 uMaxPos;

                    void main() {
                        vUv = uv;
                        
                        // 1. Obtener el ID del vértice (index)
                        float vId = float(gl_VertexID);
                        
                        // 2. Calcular coordenadas de la textura
                        float x = uTime / uTotalFrames; 
                        float y = vId / uTotalVertices;
                        
                        // 3. Leer el color del píxel (R, G, B)
                        vec3 color = texture2D(uTexture, vec2(x, y)).rgb;
                        
                        // 4. Des-normalizar: Convertir color 0-1 a posición real
                        vec3 newPosition = uMinPos + color * (uMaxPos - uMinPos);
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    void main() {
                        gl_FragColor = vec4(vUv, 1.0, 1.0); // Color básico según UV
                    }
                `,
                wireframe: true // Para que veas bien los vértices moviéndose
            });

            // Cargamos el modelo
            const gltfLoader = new GLTFLoader();
            gltfLoader.load(CONFIG.modelPath, (gltf) => {
                model = gltf.scene;
                model.traverse((child) => {
                    if (child.isMesh) child.material = vatMaterial;
                });
                scene.add(model);
                document.getElementById('info').innerHTML = "Visor VAT Activo<br>Usa el mouse para rotar";
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Actualizamos el tiempo para la animación (0 a totalFrames)
            if (vatMaterial) {
                const time = (Date.now() * 0.05) % CONFIG.totalFrames; 
                vatMaterial.uniforms.uTime.value = time;
            }
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
