<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor VAT - Billy Bologna</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-family: sans-serif; 
            pointer-events: none; 
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Cargando modelo sólido...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // CONFIGURACIÓN FINAL (DATOS DE TU LOG)
        // =========================================================================
        const CONFIG = {
            modelPath: 'my_mesh_data.obj',             
            texturePath: 'my_mesh_data_positions.png', 
            totalFrames: 299,                        
            totalVertices: 382,                      
            minPos: new THREE.Vector3(-4.2086, -1.0, -4.2086), 
            maxPos: new THREE.Vector3(4.2086, 20.3173, 4.2086),
            
            // VELOCIDAD: Sube este número para que vaya más rápido (ej: 0.2), baja para cámara lenta (ej: 0.01)
            speed: 0.1 
        };
        // =========================================================================

        let scene, camera, renderer, model, vatMaterial;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            new OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(5, 10, 5);
            scene.add(sun);

            const loader = new THREE.TextureLoader();
            const vatTexture = loader.load(CONFIG.texturePath);
            vatTexture.minFilter = THREE.NearestFilter;
            vatTexture.magFilter = THREE.NearestFilter;
            vatTexture.wrapS = THREE.RepeatWrapping; 
            vatTexture.wrapT = THREE.ClampToEdgeWrapping;

            vatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: vatTexture },
                    uMinPos: { value: CONFIG.minPos },
                    uMaxPos: { value: CONFIG.maxPos },
                    uTotalFrames: { value: CONFIG.totalFrames },
                    uTotalVertices: { value: CONFIG.totalVertices }
                },
                vertexShader: `
                    varying vec3 vPosition;
                    uniform sampler2D uTexture;
                    uniform float uTime;
                    uniform float uTotalFrames;
                    uniform float uTotalVertices;
                    uniform vec3 uMinPos;
                    uniform vec3 uMaxPos;

                    void main() {
                        float vId = float(gl_VertexID);
                        float x = uTime / uTotalFrames; 
                        float y = vId / uTotalVertices;
                        vec3 color = texture2D(uTexture, vec2(x, y)).rgb;
                        vec3 newPosition = uMinPos + color * (uMaxPos - uMinPos);
                        
                        vPosition = newPosition;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vPosition;
                    void main() {
                        // Creamos un color basado en la altura (Y) para que tenga volumen y no se vea plano
                        float brightness = smoothstep(-1.0, 20.0, vPosition.y) * 0.5 + 0.5;
                        vec3 color = vec3(0.4, 0.6, 1.0) * brightness; 
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                wireframe: false // <--- AQUÍ ESTÁ EL CAMBIO: 'false' para ver caras sólidas
            });

            const objLoader = new OBJLoader();
            objLoader.load(CONFIG.modelPath, (obj) => {
                model = obj;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material = vatMaterial;
                    }
                });
                scene.add(model);
                document.getElementById('info').innerHTML = "Visor VAT Sólido Activo";
            }, undefined, (err) => {
                document.getElementById('info').innerHTML = "Error cargando el modelo";
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (vatMaterial) {
                // Usamos CONFIG.speed para controlar la velocidad
                const time = (Date.now() * CONFIG.speed) % CONFIG.totalFrames; 
                vatMaterial.uniforms.uTime.value = time;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
