<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAT Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1c22; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 12px; left: 12px; width: 260px; color: #dde; font-size: 13px;
    background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 8px; max-height: calc(100% - 40px); overflow: auto;
  }
  #ui h4 { margin: 10px 0 2px; font-size: 12px; color: #9ab; text-transform: uppercase; letter-spacing: .05em; }
  #ui label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; }
  #ui input[type=range] { flex: 1; min-width: 0; }
  #ui input[type=file] { width: 100%; font-size: 11px; margin-top: 4px; }
  #ui select { flex: 1; }
  .val { min-width: 34px; text-align: right; color: #9ab; }
  #loading {
    position: fixed; inset: 0; background: #1a1c22; color: #dde; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px; z-index: 10;
  }
  #bar { width: 240px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0%; background: #6cf; transition: width .1s; }
  #err { position: fixed; bottom: 12px; left: 12px; color: #ff8080; font-size: 13px; max-width: 80%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading"><div>Cargando VAT…</div><div id="bar"><div id="barfill"></div></div><div id="loadtxt"></div></div>
<div id="ui" style="display:none">
  <div id="info">—</div>

  <h4>Modelo</h4>
  <label>Elegir <select id="modelSel"></select></label>

  <h4>Reproducción</h4>
  <label>Velocidad <input id="speed" type="range" min="0" max="3" step="0.05" value="1"></label>
  <label><span><input id="pause" type="checkbox"> Pausa</span></label>
  <label>Frame <input id="frame" type="range" min="0" max="1" step="0.01" value="0"></label>

  <h4>Instancias</h4>
  <label>Cantidad <input id="count" type="range" min="1" max="1000" step="1" value="1"><span class="val" id="countv">1</span></label>
  <label><span><input id="rand" type="checkbox" checked> Desfase aleatorio</span></label>

  <h4>Material</h4>
  <label>Color <input id="color" type="color" value="#c0ccdd"></label>
  <label>Metal <input id="metal" type="range" min="0" max="1" step="0.01" value="0.1"></label>
  <label>Rugosidad <input id="rough" type="range" min="0" max="1" step="0.01" value="0.55"></label>
  <label>Textura <input id="tex" type="file" accept="image/*"></label>
  <label>Normal map <input id="nmap" type="file" accept="image/*"></label>
  <div id="nmapnote" style="font-size:11px;color:#9ab"></div>
</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadVAT, checkVATSupport } from './vat.js';

// ====== CONFIG ======
// Puedes probar varios modelos en el mismo visor sin tocar el código de carga:
// añade una entrada aquí, o abre la página con ?base=./nombre
const MODELS = {
  'Esfera (my_mesh)': './my_mesh',
  'Ola (deformación real)': './wave',
};
const qBase = new URLSearchParams(location.search).get('base');
const TARGET_SIZE = 4;
// ====================

const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// --- chequeo de soporte, antes de intentar cargar nada ---
const support = checkVATSupport(renderer);
if (!support.ok) {
  $('loading').innerHTML = `<div style="max-width:280px;text-align:center">${support.reason}</div>`;
  throw new Error(support.reason);
}
if (support.reason) console.warn('vat.js:', support.reason);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(3, 6, 4);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 500);
camera.position.set(0, 3, 8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const grid = new THREE.GridHelper(10, 20, 0x444455, 0x2a2c35);
scene.add(grid);

let current = null;   // VAT activo
let randoms = Float32Array.from({ length: 1000 }, Math.random);

function layout() {
  const n = parseInt($('count').value, 10);
  const useRand = $('rand').checked;
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const m = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const gx = i % cols, gz = Math.floor(i / cols);
    m.makeTranslation((gx - (cols - 1) / 2) * current.spacing, 0, (gz - (rows - 1) / 2) * current.spacing);
    current.setInstanceMatrix(i, m);
    current.setInstancePhase(i, i === 0 || !useRand ? 0 : randoms[i] * current.meta.frames);
  }
  current.setInstanceCount(n);
  $('countv').textContent = n;

  const extent = Math.max(cols, rows) * current.spacing * current.object.scale.x;
  const dist = Math.max(TARGET_SIZE, extent) * 1.8;
  camera.position.set(0, current.height * 0.6 + dist * 0.35, dist);
  controls.target.set(0, current.height / 2, 0);
  grid.scale.setScalar(Math.max(1, extent / 10));
}

function applyMaterial() {
  current.material.color.set($('color').value);
  current.material.metalness = parseFloat($('metal').value);
  current.material.roughness = parseFloat($('rough').value);
}

async function switchModel(base) {
  $('loading').style.display = 'flex';
  $('ui').style.display = 'none';
  $('err').textContent = '';
  $('barfill').style.width = '0%';

  if (current) { scene.remove(current.object); current.dispose(); current = null; }

  try {
    const vat = await loadVAT(base, {
      size: TARGET_SIZE,
      maxInstances: 1000,
      onProgress: (p) => {
        if (p.percent != null) {
          $('barfill').style.width = `${Math.round(p.percent * 100)}%`;
          $('loadtxt').textContent = `${p.part} — ${Math.round(p.percent * 100)}%`;
        } else {
          $('loadtxt').textContent = `${p.part} — ${(p.received / 1e6).toFixed(1)} MB`;
        }
      },
    });
    current = vat;
    scene.add(vat.object);

    const m = vat.meta;
    $('info').textContent =
      `${m.mode === 'rigid' ? 'Rigid' : 'Soft'} · ${m.frames} frames · ${m.vertices} ${m.mode === 'rigid' ? 'piezas' : 'filas'} · ` +
      `${m.fps.toFixed(2)} fps · ${m.dtype ?? 'float32'}${(m.tiles ?? 1) > 1 ? ' · ' + m.tiles + ' tiles' : ''}`;
    $('frame').max = m.frames - 1;
    $('count').value = 1;
    layout();
    applyMaterial();
    if (!vat.hasNormalMapSlot) {
      $('nmap').disabled = true;
      $('nmapnote').textContent = 'Normal map: este export no tiene tangentes.';
    } else {
      $('nmap').disabled = false;
      $('nmapnote').textContent = '';
    }
    $('ui').style.display = 'block';
  } catch (e) {
    console.error(e);
    $('loadtxt').textContent = '';
    $('err').textContent = 'No se pudo cargar el modelo. Revisa la consola para más detalle.';
  } finally {
    $('loading').style.display = 'none';
  }
}

// --- selector de modelo ---
for (const name of Object.keys(MODELS)) {
  const o = document.createElement('option'); o.value = MODELS[name]; o.textContent = name;
  $('modelSel').appendChild(o);
}
if (qBase) {
  const o = document.createElement('option'); o.value = qBase; o.textContent = qBase; o.selected = true;
  $('modelSel').appendChild(o);
}
$('modelSel').onchange = (e) => switchModel(e.target.value);

$('count').oninput = layout;
$('rand').onchange = layout;
['color', 'metal', 'rough'].forEach((id) => ($(id).oninput = applyMaterial));
$('tex').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  new THREE.TextureLoader().load(URL.createObjectURL(f), (t) => { t.colorSpace = THREE.SRGBColorSpace; current.setColorMap(t); });
};
$('nmap').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  new THREE.TextureLoader().load(URL.createObjectURL(f), (t) => current.setNormalMap(t));
};

switchModel(qBase || Object.values(MODELS)[0]);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (current) {
    if ($('pause').checked) {
      current.frame = parseFloat($('frame').value);
    } else {
      current.speed = parseFloat($('speed').value);
      current.update(dt);
      $('frame').value = current.frame;
    }
  }
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
