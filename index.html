<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor VAT - Billy Bologna</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            pointer-events: none; 
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Cargando archivos de GitHub...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // CONFIGURACIÓN EXACTA SEGÚN TU GITHUB
        // =========================================================================
        const CONFIG = {
            modelPath: 'my_mesh_data.gib',            // <--- Nombre exacto de tu archivo en el repo
            texturePath: 'my_mesh_data_positions.png', // <--- Nombre exacto de tu imagen en el repo
            totalFrames: 120,                        
            totalVertices: 382,                      
            
            // ⚠️ ATENCIÓN: Pon aquí los números que te dio Maya en la consola
            minPos: new THREE.Vector3(-5.608, -2.0, -1.0), 
            maxPos: new THREE.Vector3(5.608, 10.0, 2.0)    
        };
        // =========================================================================

        let scene, camera, renderer, model, vatMaterial;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            new OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(5, 10, 5);
            scene.add(sun);

            const loader = new THREE.TextureLoader();
            const vatTexture = loader.load(CONFIG.texturePath);
            vatTexture.minFilter = THREE.NearestFilter;
            vatTexture.magFilter = THREE.NearestFilter;
            vatTexture.wrapS = THREE.RepeatWrapping; 
            vatTexture.wrapT = THREE.ClampToEdgeWrapping;

            vatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: vatTexture },
                    uMinPos: { value: CONFIG.minPos },
                    uMaxPos: { value: CONFIG.maxPos },
                    uTotalFrames: { value: CONFIG.totalFrames },
                    uTotalVertices: { value: CONFIG.totalVertices }
                },
                vertexShader: `
                    varying vec2 vUv;
                    uniform sampler2D uTexture;
                    uniform float uTime;
                    uniform float uTotalFrames;
                    uniform float uTotalVertices;
                    uniform vec3 uMinPos;
                    uniform vec3 uMaxPos;

                    void main() {
                        vUv = uv;
                        float vId = float(gl_VertexID);
                        float x = uTime / uTotalFrames; 
                        float y = vId / uTotalVertices;
                        vec3 color = texture2D(uTexture, vec2(x, y)).rgb;
                        vec3 newPosition = uMinPos + color * (uMaxPos - uMinPos);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    void main() {
                        gl_FragColor = vec4(vUv.x, vUv.y, 1.0, 1.0);
                    }
                `,
                wireframe: true
            });

            const gltfLoader = new GLTFLoader();
            gltfLoader.load(CONFIG.modelPath, (gltf) => {
                model = gltf.scene;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material = vatMaterial;
                    }
                });
                scene.add(model);
                document.getElementById('info').innerHTML = "Visor VAT Activo<br>Modelo: my_mesh_data.gib";
            }, undefined, (err) => {
                console.error("Error cargando el archivo:", err);
                document.getElementById('info').innerHTML = "Error cargando modelo. Verifica que sea un GLB real.";
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (vatMaterial) {
                const time = (Date.now() * 0.03) % CONFIG.totalFrames; 
                vatMaterial.uniforms.uTime.value = time;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
