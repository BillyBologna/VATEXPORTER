<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor VAT - Vertex Animation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            pointer-events: none; 
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Cargando Visor VAT...<br>Verifica que el modelo.glb y la textura estén en la carpeta.</div>

    <!-- Importamos Three.js desde un CDN con la ruta CORREGIDA -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // CONFIGURACIÓN: CAMBIA ESTOS VALORES CON LOS DE TU MAYA
        // =========================================================================
        const CONFIG = {
            modelPath: 'modelo.glb',                // Nombre exacto de tu archivo GLB
            texturePath: 'vertex_position_data.png', // Nombre exacto de tu imagen PNG
            totalFrames: 120,                       // Ancho de tu imagen (frames)
            totalVertices: 382,                     // Alto de tu imagen (vértices)
            
            // COPIA LOS VALORES DEL LOG DE MAYA AQUÍ:
            minPos: new THREE.Vector3(-5.608, -2.0, -1.0), // Min [X, Y, Z]
            maxPos: new THREE.Vector3(5.608, 10.0, 2.0)    // Max [X, Y, Z]
        };
        // =========================================================================

        let scene, camera, renderer, model, vatMaterial;

        init();

        function init() {
            // 1. Escena y Cámara
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            // 2. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 3. Controles y Luces
            new OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(5, 10, 5);
            scene.add(sun);

            // 4. Carga de Textura VAT
            const loader = new THREE.TextureLoader();
            const vatTexture = loader.load(CONFIG.texturePath, 
                () => { console.log("Textura cargada correctamente"); },
                undefined,
                (err) => { console.error("Error cargando textura. Verifica el nombre del archivo."); }
            );
            
            // CRUCIAL: Desactivar interpolación para leer datos exactos de píxeles
            vatTexture.minFilter = THREE.NearestFilter;
            vatTexture.magFilter = THREE.NearestFilter;
            vatTexture.wrapS = THREE.RepeatWrapping; 
            vatTexture.wrapT = THREE.ClampToEdgeWrapping;

            // 5. Creación del ShaderMaterial
            vatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: vatTexture },
                    uMinPos: { value: CONFIG.minPos },
                    uMaxPos: { value: CONFIG.maxPos },
                    uTotalFrames: { value: CONFIG.totalFrames },
                    uTotalVertices: { value: CONFIG.totalVertices }
                },
                vertexShader: `
                    varying vec2 vUv;
                    uniform sampler2D uTexture;
                    uniform float uTime;
                    uniform float uTotalFrames;
                    uniform float uTotalVertices;
                    uniform vec3 uMinPos;
                    uniform vec3 uMaxPos;

                    void main() {
                        vUv = uv;
                        
                        // Obtener el ID del vértice
                        float vId = float(gl_VertexID);
                        
                        // Calcular coordenadas UV para leer la textura
                        // x = tiempo actual / frames totales
                        // y = id del vértice / vértices totales
                        float x = uTime / uTotalFrames; 
                        float y = vId / uTotalVertices;
                        
                        // Leer color RGB del píxel
                        vec3 color = texture2D(uTexture, vec2(x, y)).rgb;
                        
                        // Convertir color (0 a 1) a posición real (min a max)
                        vec3 newPosition = uMinPos + color * (uMaxPos - uMinPos);
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    void main() {
                        // Color simple basado en UVs para dar profundidad
                        gl_FragColor = vec4(vUv.x, vUv.y, 1.0, 1.0);
                    }
                `,
                wireframe: true // Cambiar a 'false' para ver la malla sólida
            });

            // 6. Carga del Modelo GLB
            const gltfLoader = new GLTFLoader();
            gltfLoader.load(CONFIG.modelPath, (gltf) => {
                model = gltf.scene;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material = vatMaterial;
                    }
                });
                scene.add(model);
                document.getElementById('info').innerHTML = "Visor VAT Activo<br>Sube tu modelo y textura a la carpeta.";
            }, undefined, (err) => {
                console.error("Error cargando el modelo GLB. Verifica que el nombre sea correcto.");
                document.getElementById('info').innerHTML = "Error: No se encontró el modelo.glb";
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (vatMaterial) {
                // Avanza el tiempo para la animación en loop
                const time = (Date.now() * 0.03) % CONFIG.totalFrames; 
                vatMaterial.uniforms.uTime.value = time;
            }
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
