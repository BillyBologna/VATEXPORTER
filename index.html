<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor VAT - FINAL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #info { position: absolute; top: 20px; left: 20px; color: white; font-family: sans-serif; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">Cargando modelo GLB real...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const CONFIG = {
            modelPath: 'modelo.glb', 
            texturePath: 'my_mesh_data_positions.png', 
            totalFrames: 299,                        
            totalVertices: 382,                      
            minPos: new THREE.Vector3(-4.2086, -1.0, -4.2086), 
            maxPos: new THREE.Vector3(4.2086, 20.3173, 4.2086),
            speed: 0.1 
        };

        let scene, camera, renderer, vatMaterial;

        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            new OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(5, 10, 5);
            scene.add(sun);

            const loader = new THREE.TextureLoader();
            const vatTexture = loader.load(CONFIG.texturePath);
            vatTexture.minFilter = THREE.NearestFilter;
            vatTexture.magFilter = THREE.NearestFilter;
            vatTexture.wrapS = THREE.RepeatWrapping; 

            vatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: vatTexture },
                    uMinPos: { value: CONFIG.minPos },
                    uMaxPos: { value: CONFIG.maxPos },
                    uTotalFrames: { value: CONFIG.totalFrames },
                    uTotalVertices: { value: CONFIG.totalVertices }
                },
                vertexShader: `
                    varying vec3 vPos;
                    uniform sampler2D uTexture;
                    uniform float uTime;
                    uniform float uTotalFrames;
                    uniform float uTotalVertices;
                    uniform vec3 uMinPos;
                    uniform vec3 uMaxPos;

                    void main() {
                        float vId = float(gl_VertexID);
                        float x = uTime / uTotalFrames; 
                        float y = vId / uTotalVertices;
                        vec3 color = texture2D(uTexture, vec2(x, y)).rgb;
                        vec3 newPosition = uMinPos + color * (uMaxPos - uMinPos);
                        vPos = newPosition;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vPos;
                    void main() {
                        float lum = smoothstep(-1.0, 20.0, vPos.y) * 0.5 + 0.5;
                        gl_FragColor = vec4(vec3(0.2, 0.5, 1.0) * lum, 1.0);
                    }
                `,
                wireframe: false
            });

            const gltfLoader = new GLTFLoader();
            gltfLoader.load(CONFIG.modelPath, (gltf) => {
                gltf.scene.traverse((child) => {
                    if (child.isMesh) child.material = vatMaterial;
                });
                scene.add(gltf.scene);
                document.getElementById('info').innerHTML = "Visor VAT OK - Modelo GLB Cargado";
            }, undefined, (err) => {
                document.getElementById('info').innerHTML = "Error: Sube el archivo modelo.glb";
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (vatMaterial) {
                vatMaterial.uniforms.uTime.value = (Date.now() * CONFIG.speed) % CONFIG.totalFrames;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
